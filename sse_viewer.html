<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FPG SSE Viewer</title>
<style>
body {
    background:#1e1e1e;
    color:white;
    font-family:monospace;
}
pre{
    white-space:pre-wrap;
    border:1px solid #444;
    padding:10px;
    margin:10px;
}
</style>
</head>
<body>

<h2>Floor Plan Generation Stream</h2>

<button onclick="start()">Start</button>

<div id="events"></div>

<script>

async function start(){

const payload = {
  "floor_limits":{
    "max_width":160,
    "max_length":140
  },
  "aspect_ratio":1.14,
  "rooms":[
    {"room_type":"veranda","name":"Front Veranda"},
    {"room_type":"living_room","name":"Living Room"},
    {"room_type":"kitchen","name":"Kitchen"},
    {"room_type":"dining_room","name":"Dining"},
    {"room_type":"bedroom","name":"Bedroom 1"},
    {"room_type":"bedroom","name":"Bedroom 2"},
    {"room_type":"bathroom","name":"Bathroom"},
    {"room_type":"garage","name":"Garage"},
    {"room_type":"attached_bathroom","name":"Attached Bathroom"}
  ]
};

const response = await fetch("http://127.0.0.1:8080/generation/stream",{
    method:"POST",
    headers:{
        "Accept":"text/event-stream",
        "Content-Type":"application/json"
    },
    body:JSON.stringify(payload)
});

const reader=response.body.getReader();
const decoder=new TextDecoder();

let buffer="";

while(true){

    const {value,done}=await reader.read();

    if(done)break;

    buffer+=decoder.decode(value,{stream:true});

    const parts=buffer.split("\n\n");

    buffer=parts.pop();

    for(const frame of parts){

        if(frame.startsWith(":"))
            continue;

        const data=frame
            .split("\n")
            .filter(x=>x.startsWith("data:"))
            .map(x=>x.substring(5).trim())
            .join("\n");

        if(!data)
            continue;

        const obj=JSON.parse(data);

        const pre=document.createElement("pre");
        pre.textContent=JSON.stringify(obj,null,2);

        document.getElementById("events").prepend(pre);
    }

}

}

</script>

</body>
</html>
